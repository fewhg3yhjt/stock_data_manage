# 已验证输入契约：声明采集意图，保留验证限制，不自动授予生产路由资格。
input_capabilities:
  ASTOCK-001:
    provider: tencent
    endpoint: single_quote
    parameters: &id002
      code: &id001
        type: string
        source: request.symbol
        required: true
    data_kind: quote
    data_frequency: snapshot
    request_shape: single_symbol
    collection_profile: market_intraday
    implementation_status: migration_pending
    runtime_endpoint: tencent.bulk_snapshot
    display_name: 腾讯财经
    limitations:
    - 只验证单证券返回，现有批量适配器尚未完成等价验证
    - 采集节奏和3秒间隔为初始保守配置；没有持续容量验证，不自动启用路由
    evidence_refs:
    - ASTOCK-001
    request_interval_seconds: 3
    effective_concurrency: 1
    request_limit_enforcement: unimplemented
  ASTOCK-002-5m:
    provider: tencent
    endpoint: kline_5m
    display_name: 腾讯最近5分钟线
    data_kind: time_series
    data_frequency: 5m
    request_shape: single_symbol
    parameters:
      code: *id001
      count:
        type: integer
        source: config.count
        required: true
        default: 96
        minimum: 1
        maximum: 320
    collection_profile: market_intraday
    implementation_status: unimplemented
    evidence_refs:
    - ASTOCK-002
    limitations:
    - 仅实测沪市日线前复权/深市最近5分钟样本；其他周期和北交所不继承资格
    - 采集节奏和3秒间隔为初始保守配置；没有持续容量验证，不自动启用路由
    forbidden_sources:
    - request.start_date
    - request.end_date
    request_interval_seconds: 3
    effective_concurrency: 1
    request_limit_enforcement: unimplemented
  ASTOCK-002-daily:
    provider: tencent
    endpoint: kline_daily
    display_name: 腾讯前复权日线
    data_kind: time_series
    data_frequency: daily
    request_shape: single_symbol
    parameters:
      code: *id001
      start: &id005
        type: date
        source: request.start_date
        required: true
      end: &id006
        type: date
        source: request.end_date
        required: true
      adjust:
        type: string
        source: config.adjust
        required: true
        default: qfq
        choices:
        - qfq
    collection_profile: market_after_close
    implementation_status: migration_pending
    runtime_endpoint: tencent.forward_history
    evidence_refs:
    - ASTOCK-002
    limitations:
    - 仅实测沪市日线前复权/深市最近5分钟样本；其他周期和北交所不继承资格
    - 采集节奏和3秒间隔为初始保守配置；没有持续容量验证，不自动启用路由
    request_interval_seconds: 3
    effective_concurrency: 1
    request_limit_enforcement: unimplemented
  ASTOCK-003:
    provider: tdx
    endpoint: daily_package
    parameters: &id004
      date: &id003
        type: date
        source: request.trade_date
        required: true
    data_kind: file_package
    data_frequency: daily
    request_shape: file_package
    collection_profile: market_after_close
    implementation_status: unimplemented
    display_name: 通达信盘后包
    limitations:
    - 采集节奏和3秒间隔为初始保守配置；没有持续容量验证，不自动启用路由
    trading_date_parameter: date
