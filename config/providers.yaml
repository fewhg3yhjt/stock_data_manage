            source: request.as_of
            required: true
        frequencies:
        - 1
        request_limit_enforcement: physical_request
        capability_version: tencent-native-1m-v1
        role: primary
        datasets: [minute_bar_1m]
        max_symbols_per_request: 1
        request_interval_seconds: 1
        effective_concurrency: 1
