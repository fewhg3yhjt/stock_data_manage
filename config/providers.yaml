    enabled: true
    endpoints:
      daily_history:
        implementation_status: implemented
        request_group: tencent.kline
        request_shape: single_symbol
        parameters:
          symbols:
            type: strings
            source: request.symbols
            required: true
          trade_date:
            type: date
            source: request.trade_date
            required: true
        request_limit_enforcement: physical_request
        enabled: true
        role: primary
        datasets: [daily_bar]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: tencent-kline-v1
        max_symbols_per_request: 1
        max_rows_per_request: 1024
        supports_pagination: false
        request_interval_seconds: 0.5
      forward_history:
        implementation_status: implemented
        request_group: tencent.kline
        request_shape: single_symbol
        parameters:
          symbols:
            type: strings
            source: request.symbols
            required: true
