providers:
  capability_probe:
    validation_ttl_days: 7
    cooldown_probe_required: true
  failure_policy:
    consecutive_failure_threshold: 3
    cooldown_seconds: 300
  tencent:
    enabled: true
    endpoints:
      daily_history:
        enabled: true
        role: primary
        datasets: [daily_bar]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: tencent-kline-v1
        max_symbols_per_request: 1
        max_rows_per_request: 1024
        supports_pagination: false
        request_interval_seconds: 0.5
      forward_history:
        enabled: true
        role: primary
        datasets: [daily_bar]
        adjustments: [forward]
        asset_types: [stock, etf]
        exchanges: [XSHG, XSHE]
        capability_version: tencent-qfq-kline-v1
        max_symbols_per_request: 1
        max_rows_per_request: 640
        supports_pagination: false
        request_interval_seconds: 0.5
      native_1m:
        role: primary
        datasets: [minute_bar_1m]
        max_symbols_per_request: 100
        request_interval_seconds: 1
        effective_concurrency: 1
      bulk_snapshot:
        role: primary
        datasets: [snapshot, daily_bar]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: tencent-snapshot-v1
        max_symbols_per_request: 100
        request_interval_seconds: 1
  sina:
    enabled: true
    endpoints:
      full_history:
        role: primary
        datasets: [daily_bar]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: sina-cn-marketdata-v1
        max_symbols_per_request: 1
  tdx:
    enabled: false
    disabled_reason: public_servers_unstable_in_current_network
    require_capability_probe_before_enable: true
    endpoints:
      delayed_1m:
        role: fallback
        datasets: [minute_bar_1m]
        freshness_delay_seconds: 900
  eastmoney:
    enabled: false
    disabled_reason: unstable_in_current_network
    require_capability_probe_before_enable: true
    allowed_low_frequency_capabilities: [security_master]
    endpoints:
      security_list:
        enabled: false
        role: validation_only
        datasets: [security_master]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-security-list-v1
        max_symbols_per_request: 100
        request_interval_seconds: 3
      single_quote:
        enabled: false
        role: validation_only
        datasets: [realtime_quote]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-realtime-quote-v1
        request_interval_seconds: 1
      batch_quote:
        enabled: false
        role: validation_only
        datasets: [realtime_quote]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-batch-quote-v1
        max_symbols_per_request: 100
        request_interval_seconds: 1
      intraday_trend:
        enabled: false
        role: validation_only
        datasets: [intraday_trend]
        adjustments: [none]
        asset_types: [stock, etf, lof, index]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-intraday-trend-v1
        request_interval_seconds: 1
      stock_fund_flow:
        enabled: false
        role: validation_only
        datasets: [stock_fund_flow]
        adjustments: [none]
        asset_types: [stock]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-stock-fund-flow-v1
        max_symbols_per_request: 1
        request_interval_seconds: 1
      dividend_event:
        enabled: false
        role: discovery
        datasets: [dividend_event]
        adjustments: [none]
        asset_types: [stock, etf, lof]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: eastmoney-dividend-event-v1
        request_interval_seconds: 3
        page_size: 100
  baostock:
    enabled: true
    default_role: validation_only
    endpoints:
      daily_history:
        enabled: true
        role: validation_only
        datasets: [daily_bar]
        adjustments: [none, forward, backward]
        asset_types: [stock, etf, index]
        exchanges: [XSHG, XSHE]
        capability_version: baostock-daily-v1
        max_symbols_per_request: 1
        request_interval_seconds: 0.5
      minute_5m:
        enabled: true
        role: validation_only
        datasets: [minute_bar_5m]
        adjustments: [none]
        asset_types: [stock, etf]
        exchanges: [XSHG, XSHE]
        capability_version: baostock-minute-5m-v1
        max_symbols_per_request: 1
        request_interval_seconds: 0.5
      snapshot:
        enabled: false
        disabled_reason: unsupported_by_provider
  akshare:
    enabled: true
    default_role: validation_only
    endpoints:
      stock_daily:
        enabled: true
        role: validation_only
        datasets: [daily_bar]
        adjustments: [none, forward, backward]
        asset_types: [stock]
        exchanges: [XSHG, XSHE, BSE]
        capability_version: akshare-stock-daily-v1
        max_symbols_per_request: 1
        request_interval_seconds: 1
      etf_daily:
        enabled: true
        role: validation_only
        datasets: [daily_bar]
        adjustments: [none, forward, backward]
        asset_types: [etf]
        exchanges: [XSHG, XSHE]
        capability_version: akshare-etf-daily-v1
        max_symbols_per_request: 1
        request_interval_seconds: 1
      lof_daily:
        enabled: true
        role: validation_only
        datasets: [daily_bar]
        adjustments: [none, forward, backward]
        asset_types: [lof]
        exchanges: [XSHG, XSHE]
        capability_version: akshare-lof-daily-v1
        max_symbols_per_request: 1
        request_interval_seconds: 1
      index_daily:
        enabled: true
        role: validation_only
        datasets: [daily_bar]
        adjustments: [none]
        asset_types: [index]
        exchanges: [XSHG, XSHE]
        capability_version: akshare-index-daily-v1
        max_symbols_per_request: 1
        request_interval_seconds: 1
