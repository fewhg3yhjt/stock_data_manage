            type: date
            source: request.trade_date
            required: true
        request_limit_enforcement: physical_request
        enabled: true
        role: primary
        datasets: [daily_bar]
        adjustments: [forward]
        asset_types: [stock, etf]
        exchanges: [XSHG, XSHE]
        capability_version: tencent-qfq-kline-v1
        max_symbols_per_request: 1
        max_rows_per_request: 640
        supports_pagination: false
        request_interval_seconds: 0.5
