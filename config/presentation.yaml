# Read-only presentation; source mapping and unit conversion stay in normalization.
fields:
  symbol: {label: 证券代码, format: text}
  security_name: {label: 证券名称, format: text}
  asset_type: {label: 证券类型, format: asset_type}
  trade_date: {label: 交易日期, format: date}
  adjustment: {label: 复权口径, format: adjustment}
  open: {label: 开盘, format: decimal, min_decimals: 2, trim_trailing_zeros: true}
  high: {label: 最高, format: decimal, min_decimals: 2, trim_trailing_zeros: true}
  low: {label: 最低, format: decimal, min_decimals: 2, trim_trailing_zeros: true}
  close: {label: 收盘, format: decimal, min_decimals: 2, trim_trailing_zeros: true}
  volume: {label: 成交量, format: quantity}
  amount: {label: 成交额, format: decimal, min_decimals: 2, trim_trailing_zeros: true}
  provider: {label: 数据来源, format: text}
  status: {label: 数据状态, format: status}
views:
  daily:
    columns: [symbol, security_name, asset_type, trade_date, adjustment, open, high, low, close, volume, amount, provider, status]
    values: {open: values.open, high: values.high, low: values.low, close: values.close, volume: values.volume, amount: values.amount}
  daily_source:
    columns: [trade_date, symbol, security_name, asset_type, adjustment, provider, open, high, low, close, volume, amount]
    preserve_source_values: true
    technical_fields: details
    unknown_fields: details
