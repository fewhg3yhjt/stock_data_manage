dataset:
  name: st_name_list
  display_name: BaoStock 沪深 ST 名称筛选
  primary_key:
  - snapshot_at
  - exchange
  - stock_code
fields:
  snapshot_at:
    type: datetime
    required: true
  source:
    type: string
    required: true
  stock_code:
    type: string
    required: true
  exchange:
    type: string
    required: true
  stock_name:
    type: string
    required: true
  st_type:
    type: string
    required: true
