# Source candidates and published aggregates are distinct contracts. No ETF/index applicability is inferred.
dataset:
  name: daily_bar
  display_name: 日线
  primary_key:
  - instrument_id
  - trade_date
  allowed_universes:
  - all_stock
  - all_etf
  - all_lof
  - all_index
  - watchlist
  - static
  allowed_asset_types:
  - stock
  - etf
  - lof
  - index
  allowed_exchanges:
  - XSHG
  - XSHE
  - BSE
  publication:
    mode: atomic_replace
    max_missing_ratio: 0.01
    max_missing_count: 50
  schema_version: daily-aggregate-v1
  partition_dimensions:
  - trade_date
  - asset_type
applicability:
  stock:
    none: required
    forward: required
    backward: required
  etf:
    # ETF/index may publish a valid required none quote while the optional
    # adjustment slots remain explicitly unverified; no copied prices.
    none: required
    forward: unverified
    backward: unverified
  lof:
    none: required
    forward: unverified
    backward: unverified
  index:
    none: required
    forward: unverified
    backward: unverified
fields:
  instrument_id:
    type: string
    required: true
  trade_date:
    type: date
    required: true
  asset_type:
    type: enum
    values:
    - stock
    - etf
    - lof
    - index
    required: true
  value_kind:
    type: enum
    values:
    - price
    - index_points
    required: true
  quote_unit:
    type: enum
    values:
    - CNY
    - point
    required: true
  quotes:
    type: struct
    groups:
    - none
    - forward
    - backward
    required: true
candidate:
  dataset:
    name: daily_bar
    primary_key:
    - instrument_id
    - trade_date
    - adjustment
  fields:
    instrument_id:
      type: string
      required: true
    trade_date:
      type: date
      required: true
    adjustment:
      type: enum
      values:
      - none
      - forward
      - backward
      required: true
    open:
      type: decimal
      unit: CNY
      required: true
    high:
      type: decimal
      unit: CNY
      required: true
    low:
      type: decimal
      unit: CNY
      required: true
    close:
      type: decimal
      unit: CNY
      required: true
    volume:
      type: decimal
      unit: share
      required: false
    amount:
      type: decimal
      unit: CNY
      required: false
quality:
  reject_if:
  - missing_required_ohlc
  - invalid_trade_date
  - adjustment_mismatch
  - duplicate_primary_key
