dataset:
  name: security_master
  display_name: 证券主数据
  primary_key: [instrument_id]
  publication:
    mode: atomic_replace
    required_groups:
      - [XSHG, stock]
      - [XSHE, stock]
      - [BSE, stock]
      - [XSHG, etf]
      - [XSHE, etf]
    max_previous_age_days: 1
    source_groups:
      SDA-BOARD-005: [[XSHG, stock], [XSHE, stock], [XSHE, etf]]
      SECURITY-BSE-001: [[BSE, stock]]
      SECURITY-SSE-ETF-001: [[XSHG, etf]]
fields:
  instrument_id: {type: string, required: true}
  symbol: {type: string, required: true}
  exchange: {type: enum, values: [XSHG, XSHE, BSE], required: true}
  asset_type: {type: enum, values: [stock, etf, lof, index], required: true}
  name: {type: string, required: false}
  list_date: {type: date, required: false}
  delist_date: {type: date, required: false}
  status: {type: enum, values: [active, suspended, delisted, prelisted, unknown], required: true}
