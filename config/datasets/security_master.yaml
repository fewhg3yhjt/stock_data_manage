# Security Master 是金融领域的“证券主数据”：security 在此表示证券，不是安全。
# 本模板定义多个来源合并、检查后发布的证券清单；来源输入模板见 security_snapshot.yaml。
# 采集来源与频率见 ../collection.yaml 的 security_master；字段值和发布规则以本文件为准。
dataset:
  name: security_master
  display_name: 证券主数据
  primary_key: [instrument_id]
  publication:
    mode: atomic_replace
    required_groups:
      - [XSHG, stock]
      - [XSHE, stock]
      - [BSE, stock]
      - [XSHG, etf]
      - [XSHE, etf]
    # Index groups are publishable after their source qualification is registered;
    # they are not mandatory for today's production snapshot yet.
    allowed_additional_groups:
      - [XSHG, index]
      - [XSHE, index]
    max_previous_age_days: 1
    source_groups:
      SDA-BOARD-005: [[XSHG, stock], [XSHE, stock], [XSHE, etf]]
      SECURITY-BSE-001: [[BSE, stock]]
      SECURITY-SSE-ETF-001: [[XSHG, etf]]
      SECURITY-SSE-ETF-HISTORY-001: [[XSHG, etf]]
      SECURITY-SSE-MONEY-ETF-HISTORY-001: [[XSHG, etf]]
      SECURITY-SZSE-ETF-HISTORY-001: [[XSHE, etf]]
      SECURITY-BS-UNIVERSE-001: [[XSHG, stock], [XSHE, stock], [XSHG, index], [XSHE, index]]
      SECURITY-BSE-LIST-HISTORY-001: [[BSE, stock]]
      SECURITY-SSE-MAIN-HISTORY-001: [[XSHG, stock]]
      SECURITY-SSE-STAR-HISTORY-001: [[XSHG, stock]]
      SECURITY-SZSE-STOCK-HISTORY-001: [[XSHE, stock]]
      SECURITY-SSE-DELIST-HISTORY-001: [[XSHG, stock]]
      SECURITY-SZSE-DELIST-HISTORY-001: [[XSHE, stock]]

# 仅记录有直接承接证据的代码变化。日线任务在生效日及之后使用新代码请求，
# 证券身份仍以旧代码作为稳定 instrument_id；未知关系不在此处推断。
symbol_successions:
  - market: XSHE
    asset_type: index
    old_symbol: "399427"
    new_symbol: "980070"
    effective_from: "2024-04-23"
    evidence_refs:
      - tmp/batch-remediation-20261029/interface-review/raw/cni-patent-code-revision-20240423/manifest.ndjson
      - tmp/batch-remediation-20261029/interface-review/raw/cni-daily-980070/manifest.ndjson

