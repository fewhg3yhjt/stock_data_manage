dataset:
  name: futures_quote
  display_name: 国内期货快照输入
  primary_key:
  - snapshot_at
  - source_contract
fields:
  snapshot_at:
    type: datetime
    required: true
  source_contract:
    type: string
    required: true
  quote_time:
    type: datetime
    required: true
  name:
    type: string
    required: false
  open:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  high:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  low:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  last:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  bid:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  ask:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  bid_vol:
    type: decimal
    required: false
    unit: contracts
  ask_vol:
    type: decimal
    required: false
    unit: contracts
  volume:
    type: decimal
    required: false
    unit: contracts
  open_interest:
    type: decimal
    required: false
    unit: contracts
  pre_settle:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  pre_close:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  upper_limit:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  lower_limit:
    type: decimal
    required: false
    unit: source_contract_quote_unit
  avg_price:
    type: decimal
    required: false
    unit: source_contract_quote_unit
