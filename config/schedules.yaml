timezone: Asia/Shanghai

jobs:
  # 证券主数据更新作业；频率引用 collection.yaml，不在本文件重复定义。
  # 作业名称 security_master_update、频率配置 security_master_daily、数据集 security_master 职责不同。
  - name: security_master_update
    collection_profile: security_master_daily
  - name: daily_reconciliation
    time: "08:30"
  - name: realtime_minute_start
    time: "09:25"
  - name: tdx_delayed_minute_morning
    time: "09:45"
    enabled: false
  - name: tdx_delayed_minute_afternoon
    time: "13:15"
    enabled: false
  - name: realtime_minute_stop
    time: "15:05"
  - name: minute_reconciliation
    time: "15:20"
  - name: daily_bar_sync
    time: "16:20"
  - name: missing_partition_retry
    time: "20:00"
