capabilities:
  daily_bar:
    routes:
      - provider: tencent
        endpoint: forward_history
        priority: 10
        adjustments: [forward]
      - provider: sina
        endpoint: full_history
        priority: 20
        adjustments: [none]
      - provider: baostock
        endpoint: daily_history
        priority: 30
        adjustments: [none, forward, backward]
        role: validation_only
  snapshot:
    routes:
      - provider: tencent
        endpoint: bulk_snapshot
        priority: 10
        adjustments: [none]
  minute_bar_1m:
    routes:
      - provider: tencent
        endpoint: native_1m
        priority: 10
        adjustments: [none]
  minute_bar_5m:
    routes:
      - provider: sina
        endpoint: native_5m
        priority: 20
        adjustments: [none]
      - provider: baostock
        endpoint: minute_5m
        priority: 30
        adjustments: [none]
        role: validation_only
  corporate_action:
    routes:
      - provider: eastmoney
        endpoint: corporate_action
        priority: 10
        adjustments: [none]
        role: discovery
