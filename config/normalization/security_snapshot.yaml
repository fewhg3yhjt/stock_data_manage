dataset: security_snapshot
rules:
  - id: sse-etf-history-identity-v1
    input_id: SECURITY-SSE-ETF-HISTORY-001
    provider: sse
    endpoint: etf_historical_shares
    field_mapping: {trade_date: STAT_DATE, stock_code: SEC_CODE, stock_name: SEC_NAME, exchange: exchange, asset_type: asset_type, status: status}
    context_fields: {source: provider}
    status: pending_validation
    version: sse-etf-history-identity-v1
    evidence_refs: [tmp/universe-history-probe-20261011/sse/network/raw/manifest.ndjson]
    notes: 日期来自原响应统计日；保留份额记录中的ETF身份；状态unknown，不推断上市日期。
  - id: sse-money-etf-history-identity-v1
    input_id: SECURITY-SSE-MONEY-ETF-HISTORY-001
    provider: sse
    endpoint: money_etf_historical_shares
    field_mapping: {trade_date: STAT_DATE, stock_code: SEC_CODE, stock_name: SEC_NAME, exchange: exchange, asset_type: asset_type, status: status}
    context_fields: {source: provider}
    status: pending_validation
    version: sse-money-etf-history-identity-v1
    evidence_refs: [tmp/universe-history-probe-20261011/money/raw/manifest.ndjson]
    notes: 交易型货币ETF，与普通ETF名单互补；响应统计日，不使用采集日冒充。
  - id: szse-etf-history-identity-v1
    input_id: SECURITY-SZSE-ETF-HISTORY-001
    provider: szse
    endpoint: etf_historical_shares
    field_mapping: {trade_date: 日期, stock_code: 基金代码, stock_name: 基金简称, exchange: exchange, asset_type: asset_type, status: status}
    context_fields: {source: provider}
    status: pending_validation
    version: szse-etf-history-identity-v1
    evidence_refs: [tmp/universe-history-probe-20261011/szse/network/raw/manifest.ndjson]
    notes: 原XLSX非空行与SDK逐项核验；日期来自响应；状态unknown，不推断上市日期。
  - id: baostock-security-snapshot-input-v2
    input_id: SDA-BOARD-005
    provider: baostock
    endpoint: security_snapshot
    field_mapping:
      stock_code: canonical_stock_code
      stock_name: code_name
      exchange: exchange
      status: status
      asset_type: asset_type
    context_fields: {trade_date: trade_date, source: source}
    status: pending_validation
    version: baostock-security-snapshot-input-v2
    evidence_refs: [SDA-BOARD-005]
    notes: 原 SDK 两查询保持；默认保留沪深 A 股；config.include_etf=true 时补充 ETF 交易代码范围内证券，货币 ETF 不依赖名称中的 ETF 字样；排除 ETF 指数、LOF 与联接基金，新增股票代码段302。行业缺失不影响名单，不授予全市场资格。
  - id: bse-security-catalog-input-v1
    input_id: SECURITY-BSE-001
    provider: bse
    endpoint: security_snapshot
    field_mapping:
      stock_code: hqzqdm
      stock_name: hqzqjc
      exchange: exchange
      asset_type: asset_type
      status: status
    context_fields: {trade_date: source_capture_date, source: provider}
    status: pending_validation
    version: bse-security-catalog-input-v1
    evidence_refs: [provider_validation/results/raw/security-catalog-bse-20261007/manifest.ndjson]
    notes: 北交所当前官方名单；名单日期为原响应在上海时区的采集日，不使用 hqjsrq 行情日期冒充历史名单。无可靠停牌状态，status=unknown。
  - id: sse-etf-catalog-input-v1
    input_id: SECURITY-SSE-ETF-001
    provider: sse
    endpoint: etf_security_snapshot
    field_mapping:
      stock_code: FUND_CODE
      stock_name: FUND_ABBR
      exchange: exchange
      asset_type: asset_type
      status: status
      list_date: LISTING_DATE
    context_fields: {trade_date: source_capture_date, source: provider}
    status: pending_validation
    version: sse-etf-catalog-input-v1
    evidence_refs: [provider_validation/results/security-activation-20261009/official-sh-funds/_raw/manifest.ndjson]
    notes: 按上市目录全量保留ETF，含进入清算但仍在目录的证券；交易状态unknown，LISTING_DATE只表示上市日。名单日期取原响应采集日。
