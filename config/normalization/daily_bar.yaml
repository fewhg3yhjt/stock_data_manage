dataset: daily_bar

rules:
  - id: tencent-window-input-v9
    input_id: ASTOCK-002-daily
    provider: tencent
    endpoint: kline_daily
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: parameterized
    adjustment_parameter: adjust
    adjustment_mapping: {none: none, qfq: forward, hfq: backward}
    code_prefixes: [sh, sz, bj]
    field_mapping: {trade_date: "0", open: "1", high: "3", low: "4", close: "2", volume: "5", amount: "8"}
    context_fields: {instrument_id: instrument_id, adjustment: adjustment}
    null_values: [null, "", "-", "--", "None", "null"]
    source_required_numeric: ["1", "2", "3", "4", "5"]
    transforms:
      open: {remove_commas: true}
      high: {remove_commas: true}
      low: {remove_commas: true}
      close: {remove_commas: true}
    positive_fields: [open, high, low, close]
    unverified_fields: [volume, amount]
    # 按代表样本确认的来源/市场/证券类型/代码段/实际序列应用单位合同。
    # 日期不是单位边界；这不授予来源资格，也不证明全代码段逐证券覆盖。
    unit_contracts:
      - id: tencent-newfqkline-bse-stock-units-v1
        provider: tencent
        endpoint: kline_daily
        source_api: newfqkline
        exchanges: [BSE]
        asset_type: stock
        instrument_prefixes: ["BSE:92"]
        series_adjustments: {day: none, qfqday: forward, hfqday: backward}
        multipliers: {volume: "100", amount: "10000"}
        source_units: {volume: lot, amount: ten_thousand_CNY}
        precision_flags: {volume: source_volume_rounded_to_100_shares, amount: source_amount_rounded_to_100_CNY}
        evidence:
          - tmp/bse-unit-review-20261031/verification.json
      - id: tencent-newfqkline-main-growth-stock-units-v1
        provider: tencent
        endpoint: kline_daily
        source_api: newfqkline
        exchanges: [XSHG, XSHE]
        asset_type: stock
        instrument_prefixes: ["XSHG:60", "XSHE:00", "XSHE:30"]
        series_adjustments: {day: none, qfqday: forward, hfqday: backward}
        multipliers: {volume: "100", amount: "10000"}
        source_units: {volume: lot, amount: ten_thousand_CNY}
        precision_flags: {volume: source_volume_rounded_to_100_shares, amount: source_amount_rounded_to_100_CNY}
        evidence:
          - data/task_workspace/_checks/unit-review-20261030/unit-comparison.json
      - id: tencent-newfqkline-star-day-units-v1
        provider: tencent
        endpoint: kline_daily
        source_api: newfqkline
        exchanges: [XSHG]
        asset_type: stock
        instrument_prefixes: ["XSHG:688"]
        series_adjustments: {day: none}
        multipliers: {volume: "1", amount: "10000"}
        source_units: {volume: share, amount: ten_thousand_CNY}
        precision_flags: {amount: source_amount_rounded_to_100_CNY}
        evidence:
          - data/task_workspace/_checks/unit-review-20261030/unit-comparison.json
      - id: tencent-newfqkline-etf-forward-units-v1
        provider: tencent
        endpoint: kline_daily
        source_api: newfqkline
        exchanges: [XSHG, XSHE]
        asset_type: etf
        instrument_prefixes: ["XSHG:51", "XSHE:159"]
        series_adjustments: {qfqday: forward}
        multipliers: {volume: "100", amount: "10000"}
        source_units: {volume: lot_fund_units, amount: ten_thousand_CNY}
        precision_flags: {volume: source_volume_rounded_to_100_units, amount: source_amount_rounded_to_100_CNY}
        evidence:
          - data/task_workspace/_checks/unit-review-20261030/unit-comparison.json
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: unverified
    status: pending_validation
    version: tencent-window-input-v9
    evidence_refs: [ASTOCK-002]
    notes: daily_fixed三口径使用newfqkline的day/qfqday/hfqday，不重算复权价格。单位合同匹配来源、类型、市场、代码段和实际序列，日期不是白名单；BSE92股票单位基于920001的2026-10-29用户截图、量为手的明确确认及三序列原响应对照，金额只在截图显示精度内吻合。类型未知、未配置代码段、LOF、指数和其他接口/序列仍为空。代表样本不证明全代码段覆盖或生产资格；数量与金额保留来源舍入标记。none最多640条，原响应完整保留，候选只筛目标日期。

  - id: fixture-daily-v1
    provider: fixture
    endpoint: daily_history
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: none
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "100"
    amount_multiplier: "10000"
    source_bar_time_semantics: end_time
    version: fixture-v1
    status: validated

