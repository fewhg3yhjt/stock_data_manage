  - id: tencent-qfq-etf-v2
    provider: tencent
    endpoint: forward_history
    exchange: XSHG
    asset_type: etf
    frequency: null
    adjustment: forward
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: unverified
    version: tencent-qfq-etf-v2
    status: pending_validation

  - id: baostock-daily-stock-v1
    provider: baostock
    endpoint: daily_history
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: none
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "1"
