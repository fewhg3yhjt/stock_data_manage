dataset: daily_bar

rules:
  - id: tencent-window-input-v7
    input_id: ASTOCK-002-daily
    provider: tencent
    endpoint: kline_daily
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: parameterized
    adjustment_parameter: adjust
    adjustment_mapping: {none: none, qfq: forward, hfq: backward}
    code_prefixes: [sh, sz, bj]
    field_mapping: {trade_date: "0", open: "1", high: "3", low: "4", close: "2", volume: "5", amount: "8"}
    context_fields: {instrument_id: instrument_id, adjustment: adjustment}
    null_values: [null, "", "-", "--", "None", "null"]
    source_required_numeric: ["1", "2", "3", "4", "5"]
    transforms:
      open: {remove_commas: true}
      high: {remove_commas: true}
      low: {remove_commas: true}
      close: {remove_commas: true}
    positive_fields: [open, high, low, close]
    unverified_fields: [volume, amount]
    # 仅认证独立对照过的证券、接口、口径和数据日期；其他记录保持空值。
    verified_unit_scopes:
      - instrument_ids: ["XSHG:600519", "XSHE:000001", "XSHE:300750", "XSHG:510300", "XSHE:159915", "XSHG:511880"]
        source_api: newfqkline
        adjustments: [forward]
        dates: ["2026-10-09"]
        multipliers: {volume: "100", amount: "10000"}
        precision_flags: [source_volume_rounded_to_100_shares, source_amount_rounded_to_100_CNY]
        evidence: tmp/daily-online-20261012/independent-units.json
      - instrument_ids: ["XSHG:688981"]
        source_api: newfqkline
        adjustments: [forward]
        dates: ["2026-10-09"]
        multipliers: {volume: "1", amount: "10000"}
        precision_flags: [source_amount_rounded_to_100_CNY]
        evidence: tmp/daily-online-20261012/independent-units.json
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: unverified
    status: pending_validation
    version: tencent-window-input-v7
    evidence_refs: [ASTOCK-002]
    notes: daily_fixed策略三种口径均使用newfqkline，并以none/qfq/hfq读取day/qfqday/hfqday；不在本地重算复权价格。none的来源响应按结束日返回最多640条窗口，标准候选按目标日期筛选。接口额外返回列由来源行保留；标准化仅按field_mapping抽取目标字段。成交额位置8为候选映射；现有单位证据仅覆盖指定证券、newfqkline、前复权和2026-10-09，其他口径与范围保持空值。

  - id: fixture-daily-v1
    provider: fixture
    endpoint: daily_history
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: none
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "100"
    amount_multiplier: "10000"
    source_bar_time_semantics: end_time
    version: fixture-v1
    status: validated

  - id: tencent-qfq-stock-v2
    provider: tencent
    endpoint: forward_history
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: forward
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: unverified
    version: tencent-qfq-stock-v2
    status: pending_validation

  - id: tencent-qfq-etf-v2
    provider: tencent
    endpoint: forward_history
    exchange: XSHG
    asset_type: etf
    frequency: null
    adjustment: forward
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: unverified
    version: tencent-qfq-etf-v2
    status: pending_validation

  - id: baostock-daily-stock-v1
    provider: baostock
    endpoint: daily_history
    exchange: XSHG
    asset_type: stock
    frequency: null
    adjustment: none
    field_mapping: {trade_date: trade_date, open: open, high: high, low: low, close: close, volume: volume, amount: amount}
    volume_multiplier: "1"
    amount_multiplier: "1"
    volume_semantics: share
    version: baostock-daily-stock-v1
    status: pending_validation
