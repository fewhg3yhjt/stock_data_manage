timezone: Asia/Shanghai

storage:
  data_root: data
  raw_root: data/raw
  workspace_root: data/task_workspace
  archive_root: data/task_archive
  canonical_root: data/canonical
  metadata_path: data/metadata/metadata.duckdb
  raw_retention_days:
    daily_bar: 90
    snapshot: 30
    minute_bar_1m: 14

realtime_minute:
  enabled: true
  universe: watchlist
  max_watchlist_symbols: 200
  cycle_deadline_seconds: 50
  reject_full_market_universe: true
  finalize_delay_seconds: 2
  hot_store:
    type: sqlite
    path: data/hot/minute_hot.db
    wal: true

markets:
  CN_A:
    timezone: Asia/Shanghai
    sessions:
      - ["09:30", "11:30"]
      - ["13:00", "15:00"]
    bar_time_semantics: end_time
    expected_regular_minutes: 240
    include_opening_auction: false
    include_closing_auction: true

# 证券主数据采集：多个来源名单输入合并成正式证券清单（datasets/security_master.yaml）。
# source_inputs 引用 providers.yaml/input_capabilities 的输入契约 ID，不是交易所或证券类型。
# collection_profile 引用本文件 collection_profiles 的频率配置，不是数据集或目录名称。
security_master:
  collection_profile: security_master_daily
  source_inputs: [SDA-BOARD-005, SECURITY-BSE-001, SECURITY-SSE-ETF-001]
  source_config:
    SDA-BOARD-005: {include_etf: true}

# 通用模板保留为采集意图；腾讯专用模板供现有调度器执行候选采集。
collection_profiles:
  market_intraday:
    mode: intraday
    refresh_interval_seconds: 60
    business_day: trading_day
    scheduling_enabled: false
  news_intraday:
    mode: intraday
    refresh_interval_seconds: 300
    business_day: calendar_day
    scheduling_enabled: false
  market_after_close:
    mode: after_close
    business_day: trading_day
    scheduling_enabled: false
  reference_daily:
    mode: daily
    business_day: trading_day
    scheduling_enabled: false
  event_daily:
    mode: daily
    business_day: calendar_day
    scheduling_enabled: false
  macro_daily:
    mode: daily
    business_day: calendar_day
    scheduling_enabled: false
  source_market_daily:
    mode: daily
    business_day: source_calendar
    scheduling_enabled: false

  security_master_daily:
    mode: daily
    frequency: {unit: day, interval: 1, at: "08:00"}
    business_day: trading_day
    scheduling_enabled: true  # 实际执行仍须逐来源通过证据资格门禁。

  # frequency 是频率唯一来源；请求间隔仍由 providers.yaml 单独限制。
  # 天间隔按日历日计算，交易日门禁另行生效。interval > 1 时须配置 anchor_date。
  tencent_market_snapshot:
    mode: after_close
    frequency:
      unit: day
      interval: 1
      at: "15:10"
    business_day: trading_day
    universe: all_stock
    scheduling_enabled: false  # 批量能力及覆盖证据尚未完成，不能自动启动。
    settle_delay_seconds: 0
    trigger_grace_seconds: 30
  tencent_daily:
    mode: after_close
    frequency:
      unit: day
      interval: 1
      at: "16:20"
    business_day: trading_day
    universe: static  # 调度覆盖范围后续确认；不继承快照的全市场范围。
    scheduling_enabled: false
  tencent_minute_5m:
    mode: intraday
    frequency:
      unit: minute
      interval: 5
    business_day: trading_day
    universe: watchlist
    max_symbols: 200
    settle_delay_seconds: 5
    trigger_grace_seconds: 30
    scheduling_enabled: false
  tencent_minute_1m:
    mode: intraday
    frequency:
      unit: minute
      interval: 1
    business_day: trading_day
    universe: watchlist
    max_symbols: 200
    settle_delay_seconds: 2
    trigger_grace_seconds: 30
    scheduling_enabled: false  # 1分钟输入未独立验证，尚无新输入契约绑定。
