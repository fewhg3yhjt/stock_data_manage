schema_version: 2
contract_name: cn_market_bars_v2
description: A股、ETF、LOF、指数及来源专属板块的日线、收盘快照与分钟线字段契约

scope:
  markets: [XSHG, XSHE, BSE]
  instrument_types:
    - equity
    - etf
    - lof
    - index
    - industry_board
    - concept_board
  canonical_price_adjustment: none
  canonical_price_adjustment_note: >-
    Current probe implementation still validates none-adjusted bars. The target
    design uses qfq for equity, ETF and LOF daily bars after dedicated qfq
    capability probes and history-rebuild support are implemented. Index levels
    are not stock-adjusted.
  currency: CNY
  timezone: Asia/Shanghai

targets:
  instrument_master:
    primary_key: [instrument_id]
    fields:
      instrument_id: {type: string, required: true}
      market: {type: enum, values: [XSHG, XSHE, BSE, SOURCE_DEFINED], required: true}
      code: {type: string, required: true}
      name: {type: string, nullable: true}
      instrument_type:
        type: enum
        values: [equity, etf, lof, index, industry_board, concept_board]
        required: true
      provider_namespace: {type: string, nullable: true}
      list_date: {type: date, nullable: true}
      delist_date: {type: date, nullable: true}
      active: {type: bool, nullable: true}
      source_symbols: {type: "map[string, string]", required: true}

  daily_bar:
    primary_key: [instrument_id, trade_date, adjustment]
    fields:
      instrument_id: {type: string, required: true}
      instrument_type: {type: string, required: true}
      trade_date: {type: date, required: true}
      open: {type: float64, unit: CNY, nullable: true}
      high: {type: float64, unit: CNY, nullable: true}
      low: {type: float64, unit: CNY, nullable: true}
      close: {type: float64, unit: CNY, nullable: true}
      pre_close: {type: float64, unit: CNY, nullable: true}
      volume_shares: {type: int64, unit: share, nullable: true}
      amount_cny: {type: float64, unit: CNY, nullable: true}
      change_amount: {type: float64, unit: CNY, nullable: true}
      change_pct: {type: float64, unit: percent, nullable: true}
      amplitude_pct: {type: float64, unit: percent, nullable: true}
      turnover_rate_pct: {type: float64, unit: percent, nullable: true}
      adjustment: {type: enum, values: [none, qfq, hfq], required: true}
      trade_status:
        type: enum
        values: [trading, suspended, prelisted, delisted, unknown]
        required: true
      source_family: {type: string, required: true}
      source_adapter: {type: string, required: true}
      source_symbol: {type: string, required: true}
      source_timestamp: {type: datetime, nullable: true}
      fetched_at: {type: datetime, required: true}
      run_id: {type: string, required: true}
      record_status:
        type: enum
        values: [provisional, confirmed, conflict, quarantined]
        required: true
      quality_flags: {type: "list[string]", required: true}
      normalizer_version: {type: string, required: true}
      row_hash: {type: string, required: true}

  daily_snapshot:
    description: 收盘后批量快照，只能先进入 provisional，不能替代历史日线回补
    inherits: daily_bar
    overrides:
      record_status: {constant: provisional}

  minute_bar:
    primary_key: [instrument_id, bar_time, interval_minutes, adjustment]
    fields:
      instrument_id: {type: string, required: true}
      instrument_type: {type: string, required: true}
      bar_time: {type: datetime, timezone: Asia/Shanghai, required: true}
      interval_minutes: {type: int32, values: [1, 5, 15, 30, 60], required: true}
      open: {type: float64, unit: CNY, nullable: true}
      high: {type: float64, unit: CNY, nullable: true}
      low: {type: float64, unit: CNY, nullable: true}
      close: {type: float64, unit: CNY, nullable: true}
      volume_shares: {type: int64, unit: share, nullable: true}
      amount_cny: {type: float64, unit: CNY, nullable: true}
      average_price: {type: float64, unit: CNY, nullable: true}
      adjustment: {type: enum, values: [none, qfq, hfq], required: true}
      source_family: {type: string, required: true}
      source_adapter: {type: string, required: true}
      source_symbol: {type: string, required: true}
      fetched_at: {type: datetime, required: true}
      run_id: {type: string, required: true}
      quality_flags: {type: "list[string]", required: true}
      normalizer_version: {type: string, required: true}
      row_hash: {type: string, required: true}

  valuation_snapshot:
    primary_key: [instrument_id, trade_date, source_family]
    fields:
      instrument_id: {type: string, required: true}
      trade_date: {type: date, required: true}
      pe_ttm: {type: float64, nullable: true}
      pb_mrq: {type: float64, nullable: true}
      total_market_cap_cny: {type: float64, nullable: true}
      float_market_cap_cny: {type: float64, nullable: true}
      source_family: {type: string, required: true}
      fetched_at: {type: datetime, required: true}

transforms:
  parse_trade_date:
    implementation: marketdata.transforms.parse_trade_date
  parse_minute_timestamp:
    implementation: marketdata.transforms.parse_minute_timestamp
  request_instrument_id:
    implementation: marketdata.transforms.request_instrument_id
  to_float:
    implementation: marketdata.transforms.to_float
  to_int:
    implementation: marketdata.transforms.to_int
  empty_to_null:
    implementation: marketdata.transforms.empty_to_null
  baostock_adjustment:
    implementation: marketdata.transforms.baostock_adjustment
    values: {"1": hfq, "2": qfq, "3": none}
  baostock_trade_status:
    implementation: marketdata.transforms.baostock_trade_status
    values: {"0": suspended, "1": trading}
  eastmoney_volume_to_shares:
    implementation: marketdata.transforms.eastmoney_volume_to_shares
    validation_status: pending_validation
  tencent_volume_to_shares:
    implementation: marketdata.transforms.tencent_volume_to_shares
    rules:
      - when: {market: XSHG, code_prefix: ["688", "689"], endpoint_kind: snapshot}
        source_unit: share
        multiplier: 1
        validation_status: observed_2026_09_11
      - when: {market: [XSHG, XSHE, BSE], endpoint_kind: snapshot}
        source_unit: lot
        multiplier: 100
        validation_status: observed_2026_09_11
      - when:
          market: XSHG
          code_prefix: ["688", "689"]
          endpoint_kind: historical_daily
        source_unit: share
        multiplier: 1
        validation_status: observed_representative_history_2026_09_12
      - when:
          market: [XSHG, XSHE, BSE]
          endpoint_kind: historical_daily
        source_unit: lot
        multiplier: 100
        validation_status: observed_representative_history_2026_09_12
      - when:
          market: XSHG
          code_prefix: ["688", "689"]
          endpoint_kind: historical_minute
        source_unit: share
        multiplier: 1
        validation_status: observed_5m_cross_source_2026_09_12
      - when:
          market: [XSHG, XSHE, BSE]
          endpoint_kind: historical_minute
        source_unit: lot
        multiplier: 100
        validation_status: observed_equity_etf_lof_5m_2026_09_12
  tencent_amount_wan_to_cny:
    implementation: marketdata.transforms.multiply
    multiplier: 10000
  default_trade_status:
    implementation: marketdata.transforms.default_trade_status
    default: unknown

sources:
  baostock_history_daily:
    provider_family: baostock
    adapter: baostock_python
    endpoint_kind: historical_daily
    endpoint: query_history_k_data_plus
    request_interval_seconds_min: 0.5
    supported_assets_observed: [equity, etf, index]
    unsupported_assets_observed: [industry_board, concept_board, bse_equity]
    history_depth_notes:
      equity_and_index: long_history_to_listing_observed
      etf: only_169_rows_from_2026_01_05_observed_for_510300_and_159919
    raw_fields:
      - date
      - code
      - open
      - high
      - low
      - close
      - preclose
      - volume
      - amount
      - adjustflag
      - turn
      - tradestatus
      - pctChg
      - peTTM
      - pbMRQ
      - isST
    mapping:
      instrument_id: {from: code, transform: request_instrument_id}
      trade_date: {from: date, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      pre_close: {from: preclose, transform: to_float}
      volume_shares: {from: volume, transform: to_int, source_unit: share}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      change_pct: {from: pctChg, transform: to_float}
      turnover_rate_pct: {from: turn, transform: to_float}
      adjustment: {from: adjustflag, transform: baostock_adjustment}
      trade_status: {from: tradestatus, transform: baostock_trade_status}
    route_to_other_target:
      peTTM: valuation_snapshot.pe_ttm
      pbMRQ: valuation_snapshot.pb_mrq

  eastmoney_history_daily:
    provider_family: eastmoney
    adapter: raw_http
    endpoint_kind: historical_daily
    endpoint: push2his/api/qt/stock/kline/get
    request_interval_seconds_min: 3
    supported_assets_observed: [equity, index, industry_board]
    capabilities_pending_validation: [etf, bse_equity, concept_board, maximum_history]
    raw_fields:
      - datetime
      - open
      - close
      - high
      - low
      - volume
      - amount
      - amplitude
      - pct_chg
      - chg
      - turnover
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      trade_date: {from: datetime, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: eastmoney_volume_to_shares}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      change_amount: {from: chg, transform: to_float}
      change_pct: {from: pct_chg, transform: to_float}
      amplitude_pct: {from: amplitude, transform: to_float}
      turnover_rate_pct: {from: turnover, transform: to_float}
      adjustment: {from: request.fqt, values: {"0": none, "1": qfq, "2": hfq}}
      trade_status: {from: missing, transform: default_trade_status}

  tencent_history_daily:
    provider_family: tencent
    adapter: raw_http
    endpoint_kind: historical_daily
    endpoint: appstock/app/kline/kline
    request_interval_seconds_min: 0.5
    supported_assets_observed: [equity, etf, index, bse_equity]
    maximum_rows_observed: 1024
    current_probe_adjustment: none
    history_depth_notes:
      sh_sz_equity_etf_index: up_to_1024_rows
      bse_920_code: only_one_row_observed; migrated_history_not_joined
    adjusted_endpoint_observed:
      endpoint: appstock/app/fqkline/get
      adjustment: qfq
      ordinary_stock_rows_observed: 640
    raw_fields: [date, open, close, high, low, volume]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      trade_date: {from: date, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: tencent_volume_to_shares}
      adjustment: {constant: none}
      trade_status: {from: missing, transform: default_trade_status}

  sina_history_daily:
    provider_family: sina
    adapter: raw_http
    endpoint_kind: historical_daily
    endpoint: CN_MarketData.getKLineData
    request_interval_seconds_min: 3
    supported_assets_observed: [equity, etf, index, bse_equity]
    maximum_rows_observed: 1023
    adjustment_observed: none
    validation_evidence: OHLC matched BaoStock none-adjusted rows on all common representative dates
    raw_fields: [day, open, high, low, close, volume]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      trade_date: {from: day, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares:
        from: volume
        transform: to_int
        source_unit: share
        validation_status: observed_representative_history_2026_09_12
      adjustment: {constant: none, validation_status: observed_representative_history_2026_09_12}
      trade_status: {from: missing, transform: default_trade_status}

  sina_etf_history_daily_full:
    provider_family: sina
    adapter: raw_http_js_decode
    endpoint_kind: historical_daily
    endpoint: realstock/company/{symbol}/hisdata_klc2/klc_kl.js
    request_interval_seconds_min: 3
    supported_assets_observed: [etf]
    adjustment_observed: none
    history_depth_observed:
      symbol: sh510300
      rows: 3476
      start: 2012-05-28
      end: 2026-09-11
    raw_fields: [date, open, high, low, close, volume, amount, postVol, postAmt]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      trade_date: {from: date, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: to_int, source_unit: share}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      adjustment: {constant: none}
      trade_status: {from: missing, transform: default_trade_status}
    ignored_fields:
      postVol: 盘后成交量，不能合并进连续竞价成交量
      postAmt: 盘后成交额，不能合并进连续竞价成交额

  tencent_close_snapshot:
    provider_family: tencent
    adapter: raw_http
    endpoint_kind: snapshot
    endpoint: qt.gtimg.cn/q
    batch_interval_seconds_min: 3
    raw_fields:
      - source_symbol
      - name
      - code
      - close
      - pre_close
      - open
      - volume_raw_lot
      - quote_time
      - pct_change
      - high
      - low
      - amount_raw_wan
      - raw_field_count
    mapping:
      instrument_id: {from: source_symbol, transform: request_instrument_id}
      trade_date: {from: quote_time, transform: parse_trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      pre_close: {from: pre_close, transform: to_float}
      volume_shares: {from: volume_raw_lot, transform: tencent_volume_to_shares}
      amount_cny: {from: amount_raw_wan, transform: tencent_amount_wan_to_cny}
      change_pct: {from: pct_change, transform: to_float}
      source_timestamp: {from: quote_time}
      record_status: {constant: provisional}

  sina_close_snapshot:
    provider_family: sina
    adapter: paced_raw_http
    endpoint_kind: snapshot
    endpoint: Market_Center.getHQNodeData
    page_interval_seconds_min: 3
    raw_fields:
      - symbol
      - code
      - name
      - trade
      - pricechange
      - changepercent
      - buy
      - sell
      - settlement
      - open
      - high
      - low
      - volume
      - amount
      - ticktime
      - per
      - pb
      - mktcap
      - nmc
      - turnoverratio
    mapping:
      instrument_id: {from: symbol, transform: request_instrument_id}
      trade_date: {from: run_context.trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: trade, transform: to_float}
      pre_close: {from: settlement, transform: to_float}
      volume_shares: {from: volume, transform: to_int, source_unit: share}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      change_amount: {from: pricechange, transform: to_float}
      change_pct: {from: changepercent, transform: to_float}
      turnover_rate_pct: {from: turnoverratio, transform: to_float}
      source_timestamp: {from: ticktime}
      record_status: {constant: provisional}
    route_to_other_target:
      per: valuation_snapshot.pe_ttm
      pb: valuation_snapshot.pb_mrq
      mktcap: valuation_snapshot.total_market_cap_cny
      nmc: valuation_snapshot.float_market_cap_cny

  eastmoney_close_snapshot:
    provider_family: eastmoney
    adapter: paced_raw_http
    endpoint_kind: snapshot
    endpoint: push2/api/qt/clist/get
    page_interval_seconds_min: 3
    raw_fields:
      - code
      - market_id
      - name
      - open
      - high
      - low
      - close
      - pre_close
      - volume_raw_lot
      - amount_raw_cny
      - pct_change
      - amplitude
      - turnover
    mapping:
      instrument_id: {from: [market_id, code], transform: request_instrument_id}
      trade_date: {from: run_context.trade_date}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      pre_close: {from: pre_close, transform: to_float}
      volume_shares: {from: volume_raw_lot, transform: eastmoney_volume_to_shares}
      amount_cny: {from: amount_raw_cny, transform: to_float}
      change_pct: {from: pct_change, transform: to_float}
      amplitude_pct: {from: amplitude, transform: to_float}
      turnover_rate_pct: {from: turnover, transform: to_float}
      record_status: {constant: provisional}

  sina_etf_close_snapshot:
    provider_family: sina
    adapter: fund_etf_category_sina
    endpoint_kind: snapshot
    endpoint: getHQNodeDataSimple
    request_interval_seconds_min: 3
    supported_assets_observed: [etf, lof]
    universe_rows_observed:
      etf: 1659
      lof: 382
    raw_fields: [代码, 名称, 最新价, 涨跌额, 涨跌幅, 买入, 卖出, 昨收, 今开, 最高, 最低, 成交量, 成交额]
    mapping:
      instrument_id: {from: 代码, transform: request_instrument_id}
      trade_date: {from: run_context.trade_date}
      open: {from: 今开, transform: to_float}
      high: {from: 最高, transform: to_float}
      low: {from: 最低, transform: to_float}
      close: {from: 最新价, transform: to_float}
      pre_close: {from: 昨收, transform: to_float}
      volume_shares: {from: 成交量, transform: to_int, source_unit: share}
      amount_cny: {from: 成交额, transform: to_float, source_unit: CNY}
      change_amount: {from: 涨跌额, transform: to_float}
      change_pct: {from: 涨跌幅, transform: to_float}
      record_status: {constant: provisional}

  eastmoney_etf_close_snapshot:
    provider_family: eastmoney
    adapter: paced_raw_http
    endpoint_kind: snapshot
    endpoint: push2delay/api/qt/clist/get
    page_interval_seconds_min: 3
    supported_assets_observed: [etf]
    universe_rows_observed: 1606
    raw_fields: [f1, f2, f3, f4, f5, f6, f7, f8, f9, f10, f11, f12, f13, f14, f15, f16, f17, f18, f20, f21, f22, f23, f24, f25, f62, f115, f128, f140, f141, f136, f152]
    mapping:
      instrument_id: {from: [f13, f12], transform: request_instrument_id}
      trade_date: {from: run_context.trade_date}
      open: {from: f17, transform: to_float}
      high: {from: f15, transform: to_float}
      low: {from: f16, transform: to_float}
      close: {from: f2, transform: to_float}
      pre_close: {from: f18, transform: to_float}
      volume_shares: {from: f5, transform: eastmoney_volume_to_shares}
      amount_cny: {from: f6, transform: to_float, source_unit: CNY}
      change_amount: {from: f4, transform: to_float}
      change_pct: {from: f3, transform: to_float}
      amplitude_pct: {from: f7, transform: to_float}
      turnover_rate_pct: {from: f8, transform: to_float}
      record_status: {constant: provisional}
    route_to_other_target:
      f20: valuation_snapshot.total_market_cap_cny
      f21: valuation_snapshot.float_market_cap_cny

  baostock_history_minute:
    provider_family: baostock
    adapter: baostock_python
    endpoint_kind: historical_minute
    endpoint: query_history_k_data_plus
    request_interval_seconds_min: 0.5
    supported_intervals_observed: [5]
    unsupported_intervals_observed: [1]
    supported_assets_observed: [equity, etf]
    empty_assets_observed: [lof, index]
    unsupported_assets_observed: [bse_equity, industry_board, concept_board]
    raw_fields: [date, time, code, open, high, low, close, volume, amount, adjustflag]
    mapping:
      instrument_id: {from: code, transform: request_instrument_id}
      bar_time: {from: [date, time], transform: parse_minute_timestamp}
      interval_minutes: {from: request.frequency, transform: to_int}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: to_int, source_unit: share}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      adjustment: {from: adjustflag, transform: baostock_adjustment}

  eastmoney_history_minute:
    provider_family: eastmoney
    adapter: raw_http
    endpoint_kind: historical_minute
    endpoints:
      1: push2his/api/qt/stock/trends2/get
      aggregated: push2his/api/qt/stock/kline/get
    request_interval_seconds_min: 3
    declared_intervals: [1, 5, 15, 30, 60]
    declared_assets: [equity, etf, lof, index, bse_equity, industry_board, concept_board]
    current_network_validation: blocked_by_remote_disconnect_after_5_requests_2026_09_12
    raw_fields:
      common: [datetime, open, close, high, low, volume, amount]
      one_minute_extra: [average_price]
      aggregated_extra: [amplitude, pct_chg, chg, turnover]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      bar_time: {from: datetime, transform: parse_minute_timestamp}
      interval_minutes: {from: request.period, transform: to_int}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: eastmoney_volume_to_shares}
      amount_cny: {from: amount, transform: to_float, source_unit: CNY}
      average_price: {from: average_price, transform: to_float}
      adjustment: {constant: none}

  tencent_history_minute:
    provider_family: tencent
    adapter: raw_http
    endpoint_kind: historical_minute
    endpoint: appstock/app/kline/mkline
    request_interval_seconds_min: 0.5
    supported_intervals_observed: [1, 5]
    supported_assets_observed: [equity, etf, lof, index]
    empty_assets_observed: [bse_equity]
    unsupported_assets_observed: [industry_board, concept_board]
    maximum_rows_requested_and_observed: 120
    raw_fields: [datetime, open, close, high, low, volume]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      bar_time: {from: datetime, transform: parse_minute_timestamp}
      interval_minutes: {from: request.period, transform: to_int}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: tencent_volume_to_shares}
      adjustment: {constant: none}

  sina_history_minute:
    provider_family: sina
    adapter: raw_http
    endpoint_kind: historical_minute
    endpoint: CN_MarketData.getKLineData
    request_interval_seconds_min: 3
    supported_intervals_observed: [5]
    unavailable_intervals_observed: {1: returned_null_for_all_9_representative_securities}
    supported_assets_observed: [equity, etf, lof, index, bse_equity]
    unsupported_assets_observed: [industry_board, concept_board]
    maximum_rows_requested_and_observed: 120
    raw_fields: [day, open, high, low, close, volume]
    mapping:
      instrument_id: {from: request_context, transform: request_instrument_id}
      bar_time: {from: day, transform: parse_minute_timestamp}
      interval_minutes: {from: request.scale, transform: to_int}
      open: {from: open, transform: to_float}
      high: {from: high, transform: to_float}
      low: {from: low, transform: to_float}
      close: {from: close, transform: to_float}
      volume_shares: {from: volume, transform: to_int, source_unit: share}
      adjustment: {constant: none}

quality_rules:
  hard:
    - unique(instrument_id, trade_date, adjustment)
    - high >= max(open, close)
    - low <= min(open, close)
    - high >= low
    - volume_shares >= 0
    - amount_cny >= 0
  special_cases:
    suspended:
      requirement: trade_status must be preserved before interpreting zero OHLC
    snapshot:
      requirement: only accept after market close and matching source trade date
    adjusted_price:
      requirement: never compare or merge rows with different adjustment values
  confirmation:
    normal_trading:
      minimum_independent_provider_families: 2
    single_source:
      record_status: provisional
    conflict:
      action: quarantine
