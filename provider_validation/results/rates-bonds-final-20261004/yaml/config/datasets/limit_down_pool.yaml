dataset:
  name: limit_down_pool
  display_name: 跌停池输入
  primary_key:
  - trade_date
  - source_security_code
fields:
  trade_date:
    type: date
    required: true
  snapshot_at:
    type: datetime
    required: true
  source_security_code:
    type: string
    required: true
  name:
    type: string
    required: true
  change_pct:
    type: decimal
    unit: percent
    required: true
  price:
    type: decimal
    unit: CNY
    required: true
  amount:
    type: decimal
    unit: CNY
    required: false
  float_market_cap:
    type: decimal
    unit: CNY
    required: false
  total_market_cap:
    type: decimal
    unit: CNY
    required: false
  turnover_rate:
    type: decimal
    unit: percent
    required: false
  industry:
    type: string
    required: false
  pe_dynamic:
    type: decimal
    required: true
    unit: ratio
  limit_capital:
    type: decimal
    required: false
    unit: CNY
  last_limit_time:
    type: string
    required: true
  limit_board_amount:
    type: decimal
    required: false
    unit: CNY
  consecutive_limit_down_count:
    type: integer
    required: true
  opened_count:
    type: integer
    required: true
