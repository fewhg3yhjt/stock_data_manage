dataset:
  name: dragon_tiger_daily
  display_name: 全市场龙虎榜日期事件候选输入
  primary_key: [snapshot_at, source_security_code, trade_date, listing_reason]
fields:
  snapshot_at: {type: datetime, required: true}
  source_security_code: {type: string, required: true}
  name: {type: string, required: false}
  trade_date: {type: date, required: true}
  listing_reason: {type: string, required: true}
  interpretation: {type: string, required: false}
  close_price: {type: decimal, required: false, unit: unverified}
  change: {type: decimal, required: false, unit: unverified}
  net_buy_amount: {type: decimal, required: false, unit: unverified}
  buy_amount: {type: decimal, required: false, unit: unverified}
  sell_amount: {type: decimal, required: false, unit: unverified}
  billboard_amount: {type: decimal, required: false, unit: unverified}
  market_amount: {type: decimal, required: false, unit: unverified}
  net_buy_ratio: {type: decimal, required: false, unit: unverified}
  billboard_ratio: {type: decimal, required: false, unit: unverified}
  turnover: {type: decimal, required: false, unit: unverified}
  free_market_cap: {type: decimal, required: false, unit: unverified}
  return_after_1d: {type: decimal, required: false, unit: unverified}
  return_after_2d: {type: decimal, required: false, unit: unverified}
  return_after_5d: {type: decimal, required: false, unit: unverified}
  return_after_10d: {type: decimal, required: false, unit: unverified}
