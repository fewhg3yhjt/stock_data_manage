  status: pending_validation
  version: actual-data-input-v1
  evidence_refs:
  - ASTOCK-037
  notes: 按原成功数据范围接入；snapshot_at 为原响应捕获时间，不是来源生效日期。原字段独立留证，不自动启用生产。
